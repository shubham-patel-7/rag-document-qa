[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa-rag"
version = "1.0.0"
description = "Document Q&A with hybrid retrieval (FAISS + BM25), page-level citations and a built-in retrieval evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scikit-learn>=1.3", "pypdf>=4.0", "faiss-cpu>=1.8", "rank-bm25>=0.2.2",
  "streamlit>=1.35", "matplotlib>=3.8", "joblib>=1.3",
]

[project.optional-dependencies]
minilm = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[project.scripts]
docqa = "docqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
